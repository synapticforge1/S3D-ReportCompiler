name: Publish to JSR and npm

# 🔒 The owner's order (2026-11-10, workspace release-process.md § 5, letter H33): "the CI to check
# first, then push the tag, and then create the release page from the tag, then publish the
# package to the registry for the project in that order." `bun run bump <level>` commits
# `bump to vX.Y.Z`; `bun run release` pushes `main` ONLY -- no tag is made on a machine, ever. This
# workflow runs on every push to main:
#
#   checks     {contents, actions: read} U5. Is this a release -- does jsr.json's version have no
#              tag yet (or one on THIS commit: a re-run)? If not, it stops there. If so: both
#              registries free, ci.yml green on this commit (every test, every runtime), the JSR
#              upload check, the compatibility gate in release mode. Every third-party tool runs
#              here or in npm-build, never beside a write or publishing credential.
#   tag        {contents: write} U6. scripts/github-api.ts `tag`, fetched alone: the annotated tag
#              vX.Y.Z on this commit, through the REST API, read back. A tag made with GITHUB_TOKEN
#              starts no workflow run, so everything after it is in THIS run (`needs:`).
#   release    {contents: write} U7. The GitHub Release page FROM the tag, by H32's recipe; the
#              registry links of the version about to be published on top.
#   jsr        {id-token: write} U8. Skips when JSR has the version; deno publish; the Rekor
#              read-back, FATAL.
#   npm-build  {contents: read} builds and proves the npm package (no credential); an artifact.
#   npm        {id-token: write} U8. That artifact; skips when npm has the version (of this
#              commit); npm publish (trusted publishing); the provenance read-back, FATAL.
#
# Failure (U12): "Re-run failed jobs" -- every job skips what is done (a tag at this commit, a
# page, a version a registry serves). Never a new tag for the same code, never a moved tag. There
# is no "Run workflow" entry any more: the npm-only recovery it served (1.1.0) is a re-run of the
# npm jobs now.
#
# npm's trusted publisher for @synapticforge1/s3d-reportcompiler names THIS file and no
# environment (owner, 2026-10-28): renaming the file or adding an environment breaks npm
# publishing. 🔒 JSR and npm are released together, always (owner, 2026-10-28).
#
# Until 2026-11-10 a v* tag pushed from the owner's machine started this workflow, and it wrote a
# release/<tag> branch to record the commit JSR got, because a pushed tag could be moved. CI's tag
# is the record now; the release/v* branches of 1.0.4 to 1.3.0 stay.

on:
  push:
    branches: [main]

# Each commit of main is its own group, never cancelled: GitHub cancels a PENDING run when a newer
# one joins its group even with cancel-in-progress off, so one group for main could drop a bump
# commit's run queued behind another push (ci.yml does the same, for the same reason). Two pushes
# carrying the same untagged version cannot both release it: the second `tag` job finds the tag on
# the other commit and refuses.
concurrency:
  group: publish-${{ github.sha }}
  cancel-in-progress: false

permissions: {}

# Every downloaded tool pinned by version AND sha256 (U9), each digest matched to the vendor's
# published checksum (2026-11-10). Bun is the latest installed (Tooling rule 10).
env:
  BUN_VERSION: "1.4.4"
  BUN_SHA256: "bf8ccbfb2b0b80159e0f9a6d15c55317add8077534dbc6130a3edb52fccb395c"
  DENO_VERSION: "2.9.8"
  DENO_SHA256: "e890975bc2549807bbcc0b584ffafda72cc7c93349dd99c80483dd784f6c4609"
  NODE_VERSION: "24.21.0"
  NODE_SHA256: "fd8e59d5a511510f6a298afb548f18c7d2b1be404d8b4a27d94fbe49f56cb2d6"
  NPM_PACKAGE: "@synapticforge1/s3d-reportcompiler"

jobs:
  checks:
    name: Checks (is this a release?)
    runs-on: ubuntu-latest
    permissions:
      actions: read # ci.yml's run on this commit
      contents: read
    outputs:
      release: ${{ steps.release.outputs.release }}
      tag: ${{ steps.release.outputs.tag }}
    steps:
      # Token-less, full history and tags (the compatibility gate compares with the last tag).
      - name: Checkout (no credentials)
        run: |
          git clone -q "https://github.com/${GITHUB_REPOSITORY}" .
          git checkout -q --detach "$GITHUB_SHA"
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"

      # A release when jsr.json's version has no tag on GitHub yet; a re-run when the tag is on THIS
      # commit; anything else (the tag on an older commit) is an ordinary push of main, and ci.yml
      # is what checks it.
      - name: Is this a release?
        id: release
        run: |
          VERSION="$(jq -r .version jsr.json)"
          TAG="v${VERSION}"
          AT=$(git ls-remote "https://github.com/${GITHUB_REPOSITORY}" "refs/tags/${TAG}" "refs/tags/${TAG}^{}" \
            | awk '{ if ($2 ~ /\^\{\}$/) p = $1; else t = $1 } END { print (p != "" ? p : t) }')
          if [ -z "$AT" ]; then STATE=new; elif [ "$AT" = "$GITHUB_SHA" ]; then STATE=rerun; else STATE=released; fi
          echo "jsr.json ${VERSION}; tag ${TAG} on GitHub: ${AT:-(absent)} -> ${STATE}"
          if [ "$STATE" = released ]; then echo "release=false" >> "$GITHUB_OUTPUT"; exit 0; fi
          if ! printf '%s' "$VERSION" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+$'; then echo "::error::not a release version: $VERSION"; exit 1; fi
          for f in package.json; do
            if [ "$(jq -r .version "$f")" != "$VERSION" ]; then echo "::error::${f} says $(jq -r .version "$f"), jsr.json ${VERSION}"; exit 1; fi
          done
          if ! grep -q "^export const VERSION = \"${VERSION}\";" src/report_core.ts; then echo "::error::src/report_core.ts does not say ${VERSION}"; exit 1; fi
          echo "release=true" >> "$GITHUB_OUTPUT"
          echo "tag=${TAG}" >> "$GITHUB_OUTPUT"
          echo "state=${STATE}" >> "$GITHUB_OUTPUT"

      # A NEW release needs both registries free. npm never reuses a number, a removed one
      # included, and its package document keeps every number in `time` (review 5). A re-run skips
      # this: the jobs below skip what is already published.
      - name: Version free on JSR and npm
        if: steps.release.outputs.state == 'new'
        env:
          TAG: ${{ steps.release.outputs.tag }}
        run: |
          VERSION="${TAG#v}"
          PKG="$(jq -r .name jsr.json)"; SCOPE=${PKG%/*}; SCOPE=${SCOPE#@}; NAME=${PKG#*/}
          JSR=$(curl -s -o /dev/null -w '%{http_code}' --max-time 30 -H "Cache-Control: no-cache" "https://api.jsr.io/scopes/${SCOPE}/packages/${NAME}/versions/${VERSION}?cb=${GITHUB_RUN_ID}")
          DOC=$(curl -s -o npm-doc.json -w '%{http_code}' --max-time 30 -H "Cache-Control: no-cache" "https://registry.npmjs.org/${NPM_PACKAGE/\//%2f}?cb=${GITHUB_RUN_ID}")
          case "$DOC" in
            404) NPM=free ;;
            200) NPM=$(jq -r --arg v "$VERSION" 'if (.time | type) != "object" then "unknown" elif (.time | has($v)) then "taken" else "free" end' npm-doc.json) ;;
            *) NPM="HTTP $DOC" ;;
          esac
          rm -f npm-doc.json
          echo "JSR ${VERSION}: HTTP ${JSR}; npm ${VERSION}: ${NPM}"
          if [ "$JSR" != "404" ] || [ "$NPM" != "free" ]; then
            echo "::error::${VERSION} is not free on both registries (JSR ${JSR}, npm ${NPM}) -- refusing before the tag."
            exit 1
          fi

      - name: Install Bun ${{ env.BUN_VERSION }}, Node ${{ env.NODE_VERSION }}, Deno ${{ env.DENO_VERSION }} (pinned by sha256)
        if: steps.release.outputs.release == 'true'
        run: |
          curl -fsSL --retry 5 --retry-all-errors --max-time 300 -o "$RUNNER_TEMP/bun.zip" "https://github.com/oven-sh/bun/releases/download/bun-v${BUN_VERSION}/bun-linux-x64.zip"
          echo "${BUN_SHA256}  $RUNNER_TEMP/bun.zip" | sha256sum -c -
          unzip -q "$RUNNER_TEMP/bun.zip" -d "$RUNNER_TEMP"
          mkdir -p "$HOME/.bun/bin" && mv "$RUNNER_TEMP/bun-linux-x64/bun" "$HOME/.bun/bin/bun"
          echo "$HOME/.bun/bin" >> "$GITHUB_PATH"
          curl -fsSL --retry 5 --retry-all-errors --max-time 300 -o "$RUNNER_TEMP/node.tar.xz" "https://nodejs.org/dist/v${NODE_VERSION}/node-v${NODE_VERSION}-linux-x64.tar.xz"
          echo "${NODE_SHA256}  $RUNNER_TEMP/node.tar.xz" | sha256sum -c -
          mkdir -p "$HOME/node" && tar -xJf "$RUNNER_TEMP/node.tar.xz" -C "$HOME/node" --strip-components=1
          echo "$HOME/node/bin" >> "$GITHUB_PATH"
          curl -fsSL --retry 5 --retry-all-errors --max-time 300 -o "$RUNNER_TEMP/deno.zip" "https://github.com/denoland/deno/releases/download/v${DENO_VERSION}/deno-x86_64-unknown-linux-gnu.zip"
          echo "${DENO_SHA256}  $RUNNER_TEMP/deno.zip" | sha256sum -c -
          mkdir -p "$HOME/.deno/bin" && unzip -q "$RUNNER_TEMP/deno.zip" -d "$HOME/.deno/bin"
          echo "$HOME/.deno/bin" >> "$GITHUB_PATH"

      # Nothing is released from a commit CI did not pass: ci.yml runs every test on every runtime
      # for each commit of main. This waits for its PUSH run of this commit (a pull_request run
      # tests a merge commit, not this one) and requires success. No run, a failed run, a cancelled
      # one, or one still going after 40 minutes: refused. GitHub's REST API from the Bun script,
      # never the GitHub CLI (H30).
      - name: ci.yml passed on this commit
        if: steps.release.outputs.release == 'true'
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          for i in $(seq 1 80); do
            RUN=$(bun scripts/github-api.ts ci-run "${GITHUB_SHA}" || true)
            set -- $RUN
            if [ "${1:-}" = "completed" ]; then
              if [ "${2:-}" = "success" ]; then
                echo "✅ CI passed on ${GITHUB_SHA}: ${3}"
                exit 0
              fi
              echo "::error::CI on ${GITHUB_SHA} concluded '${2}', not success -- refusing to release (${3})."
              exit 1
            fi
            echo "  attempt ${i}/80: CI on ${GITHUB_SHA} is '${1:-not started}'"
            sleep 30
          done
          echo "::error::No completed CI run for ${GITHUB_SHA} after 40 minutes -- refusing to release."
          exit 1

      - name: Install dependencies
        if: steps.release.outputs.release == 'true'
        run: bun install --frozen-lockfile

      # The last gate before an IMMUTABLE version: publish to a fake JSR on 127.0.0.1 (dummy token,
      # no provenance) and read the tarball -- `deno publish` has exited 0 on a corrupted upload.
      - name: The upload is this package, intact
        if: steps.release.outputs.release == 'true'
        run: bun scripts/jsr-upload-check.ts

      # SemVer is a gate result (letter H6): the surface since the last tag must meet the floor,
      # and for a patch or minor the last tag's samples must PASS on this code (Chrome renders).
      # `--unpublished`: a v<version> tag on this commit is a re-run's, not a release.
      - name: The compatibility gate allows this version
        if: steps.release.outputs.release == 'true'
        env:
          TAG: ${{ steps.release.outputs.tag }}
        run: bun scripts/compat.ts release "${TAG#v}" --unpublished

  tag:
    name: Tag ${{ needs.checks.outputs.tag }}
    needs: checks
    if: needs.checks.outputs.release == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Install Bun ${{ env.BUN_VERSION }} (pinned by sha256)
        run: |
          curl -fsSL --retry 5 --retry-all-errors --max-time 300 -o "$RUNNER_TEMP/bun.zip" "https://github.com/oven-sh/bun/releases/download/bun-v${BUN_VERSION}/bun-linux-x64.zip"
          echo "${BUN_SHA256}  $RUNNER_TEMP/bun.zip" | sha256sum -c -
          unzip -q "$RUNNER_TEMP/bun.zip" -d "$RUNNER_TEMP"
          mkdir -p "$HOME/.bun/bin" && mv "$RUNNER_TEMP/bun-linux-x64/bun" "$HOME/.bun/bin/bun"
          echo "$HOME/.bun/bin" >> "$GITHUB_PATH"

      # No checkout beside the write token (C30, H32): the one script, fetched alone at this commit.
      - name: Fetch the GitHub API script at this commit
        run: |
          curl -fsSL --retry 5 --retry-all-errors --max-time 60 -o "$RUNNER_TEMP/github-api.ts" \
            "https://raw.githubusercontent.com/${GITHUB_REPOSITORY}/${GITHUB_SHA}/scripts/github-api.ts"

      # An existing tag on this commit is done (a re-run); on any other commit, refused.
      - name: Create the annotated tag (REST API)
        env:
          GITHUB_TOKEN: ${{ github.token }}
          TAG: ${{ needs.checks.outputs.tag }}
        run: bun "$RUNNER_TEMP/github-api.ts" tag "${TAG}" "${GITHUB_SHA}"

  release:
    name: GitHub Release ${{ needs.checks.outputs.tag }}
    needs: [checks, tag]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Install Bun ${{ env.BUN_VERSION }} (pinned by sha256)
        run: |
          curl -fsSL --retry 5 --retry-all-errors --max-time 300 -o "$RUNNER_TEMP/bun.zip" "https://github.com/oven-sh/bun/releases/download/bun-v${BUN_VERSION}/bun-linux-x64.zip"
          echo "${BUN_SHA256}  $RUNNER_TEMP/bun.zip" | sha256sum -c -
          unzip -q "$RUNNER_TEMP/bun.zip" -d "$RUNNER_TEMP"
          mkdir -p "$HOME/.bun/bin" && mv "$RUNNER_TEMP/bun-linux-x64/bun" "$HOME/.bun/bin/bun"
          echo "$HOME/.bun/bin" >> "$GITHUB_PATH"

      - name: Fetch the GitHub API script at this commit
        run: |
          curl -fsSL --retry 5 --retry-all-errors --max-time 60 -o "$RUNNER_TEMP/github-api.ts" \
            "https://raw.githubusercontent.com/${GITHUB_REPOSITORY}/${GITHUB_SHA}/scripts/github-api.ts"

      # H32's order: the tag peels to this commit (POST /releases would CREATE a missing tag); an
      # existing page is done, nothing written; else POST with the registry links on top of
      # generated notes, read back, the tag peeled again. Before the publish, by the owner's order:
      # a failed publish leaves a page for a version its re-run then publishes.
      - name: Create the GitHub Release page from the tag (REST API)
        env:
          GITHUB_TOKEN: ${{ github.token }}
          TAG: ${{ needs.checks.outputs.tag }}
        run: bun "$RUNNER_TEMP/github-api.ts" release "${TAG}" "${GITHUB_SHA}"

  jsr:
    name: Publish ${{ needs.checks.outputs.tag }} to JSR
    needs: [checks, release]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    env:
      TAG: ${{ needs.checks.outputs.tag }}
    steps:
      # The tag must still name this commit, and jsr.json the tag's version.
      - name: This commit (no credentials)
        run: |
          git init -q .
          git remote add origin "https://github.com/${GITHUB_REPOSITORY}"
          git fetch -q --depth=1 origin "$GITHUB_SHA"
          git checkout -q --detach FETCH_HEAD
          AT=$(git ls-remote origin "refs/tags/${TAG}" "refs/tags/${TAG}^{}" \
            | awk '{ if ($2 ~ /\^\{\}$/) p = $1; else t = $1 } END { print (p != "" ? p : t) }')
          if [ "$AT" != "$GITHUB_SHA" ]; then echo "::error::tag ${TAG} is ${AT:-absent}, not this commit"; exit 1; fi
          if [ "v$(jq -r .version jsr.json)" != "$TAG" ]; then echo "::error::jsr.json says $(jq -r .version jsr.json), the tag is ${TAG}"; exit 1; fi

      - name: Install Deno ${{ env.DENO_VERSION }} and Bun ${{ env.BUN_VERSION }} (pinned by sha256)
        run: |
          curl -fsSL --retry 5 --retry-all-errors --max-time 300 -o "$RUNNER_TEMP/deno.zip" "https://github.com/denoland/deno/releases/download/v${DENO_VERSION}/deno-x86_64-unknown-linux-gnu.zip"
          echo "${DENO_SHA256}  $RUNNER_TEMP/deno.zip" | sha256sum -c -
          mkdir -p "$HOME/.deno/bin" && unzip -q "$RUNNER_TEMP/deno.zip" -d "$HOME/.deno/bin"
          echo "$HOME/.deno/bin" >> "$GITHUB_PATH"
          curl -fsSL --retry 5 --retry-all-errors --max-time 300 -o "$RUNNER_TEMP/bun.zip" "https://github.com/oven-sh/bun/releases/download/bun-v${BUN_VERSION}/bun-linux-x64.zip"
          echo "${BUN_SHA256}  $RUNNER_TEMP/bun.zip" | sha256sum -c -
          unzip -q "$RUNNER_TEMP/bun.zip" -d "$RUNNER_TEMP"
          mkdir -p "$HOME/.bun/bin" && mv "$RUNNER_TEMP/bun-linux-x64/bun" "$HOME/.bun/bin/bun"
          echo "$HOME/.bun/bin" >> "$GITHUB_PATH"

      # ⚠️ The ONE install beside a publishing credential, recorded as this repo's U8 exception
      # (cmem/release.md): jsr.json sets "nodeModulesDir": "manual" -- Deno reads the same
      # node_modules as Node and Bun, which is what makes the three produce identical output
      # (cmem/architecture.md) -- so `deno publish` needs one on disk, or it stops at
      #   error: Could not find "mathjax-full" in a node_modules folder.
      # Bun installs bun.lock exactly (--frozen-lockfile, integrity-checked) and runs NOTHING
      # installed (--ignore-scripts); the publish only reads it. (Owner, 2026-11-10: Bun, not a
      # Deno-side resolution.)
      - name: Install dependencies (lockfile exact, no scripts)
        run: bun install --frozen-lockfile --ignore-scripts

      # Provenance requires a GitHub OIDC token; `id-token: write` injects
      # ACTIONS_ID_TOKEN_REQUEST_URL/_TOKEN. If they are absent, an org/enterprise OIDC policy is
      # blocking it and `deno publish` silently skips provenance. A prerequisite only: the
      # read-back below is the real check.
      - name: Check OIDC availability (provenance prerequisite)
        run: |
          if [ -n "${ACTIONS_ID_TOKEN_REQUEST_URL:-}" ] && [ -n "${ACTIONS_ID_TOKEN_REQUEST_TOKEN:-}" ]; then
            echo "OIDC token endpoint available — provenance prerequisites met."
          else
            echo "::warning::OIDC token NOT available (URL present: ${ACTIONS_ID_TOKEN_REQUEST_URL:+yes}, TOKEN present: ${ACTIONS_ID_TOKEN_REQUEST_TOKEN:+yes}). deno publish will skip provenance."
          fi

      # `deno publish` SKIPS an existing version with exit 0, so the skip is explicit: a re-run
      # after a failure past the upload goes on to the read-back.
      - name: Publish to JSR (unless JSR already has the version)
        run: |
          VERSION="${TAG#v}"
          PKG="$(jq -r .name jsr.json)"; SCOPE=${PKG%/*}; SCOPE=${SCOPE#@}; NAME=${PKG#*/}
          CODE=$(curl -s -o /dev/null -w '%{http_code}' --max-time 30 -H "Cache-Control: no-cache" "https://api.jsr.io/scopes/${SCOPE}/packages/${NAME}/versions/${VERSION}?cb=${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}")
          case "$CODE" in
            200) echo "JSR already has ${VERSION} (a re-run): not uploading again" ;;
            404) deno publish ;;
            *) echo "::error::JSR version probe: HTTP $CODE"; exit 1 ;;
          esac

      # THE evidence of provenance, and FATAL (U8; it only warned, in a job of its own, until
      # 2026-11-10 -- the owner's 2026-08-08 "JSR-side, ignore it" was about wasmtk's missing
      # rekorLogId, and every Actions release of this package has been attested, cmem/release.md).
      # A green run is not proof. JSR caches this endpoint, so every read is cache-busted.
      - name: Verify provenance was recorded on JSR
        run: |
          PKG="$(jq -r .name jsr.json)"; SCOPE=${PKG%/*}; SCOPE=${SCOPE#@}; NAME=${PKG#*/}
          VERSION=${TAG#v}
          URL="https://api.jsr.io/scopes/${SCOPE}/packages/${NAME}/versions/${VERSION}"
          echo "Checking $URL"
          for i in $(seq 1 40); do
            BODY=$(curl -sf --max-time 30 -H "Accept: application/json" -H "Cache-Control: no-cache" "${URL}?cb=${GITHUB_RUN_ID}-${i}" || true)
            REKOR=$(printf '%s' "$BODY" | jq -r '.rekorLogId // empty' 2>/dev/null || true)
            if [ -n "$REKOR" ]; then
              echo "✅ Provenance recorded — Rekor log ID: $REKOR"
              echo "- JSR: ${PKG}@${VERSION}, Rekor log ID $REKOR" >> "$GITHUB_STEP_SUMMARY"
              exit 0
            fi
            echo "  attempt $i: not recorded yet, retrying in 15s"
            sleep 15
          done
          echo "::error::${PKG}@${VERSION} has no provenance (no Rekor entry) after 10 minutes. If the upload happened, the version exists and is immutable. Check the OIDC step above, the org/enterprise OIDC policy, and the JSR↔GitHub repo link."
          exit 1

  # The npm package is BUILT here, with no publishing credential: the build runs tsc and the
  # installed dependencies (2026-11-07 review). After JSR: the proof compares the export list with
  # JSR's own npm build of this version, and npm only ever publishes a version JSR has.
  npm-build:
    name: Build and prove the npm package
    needs: [checks, jsr]
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout this commit (no credentials)
        run: |
          git init -q .
          git remote add origin "https://github.com/${GITHUB_REPOSITORY}"
          git fetch -q --depth=1 origin "$GITHUB_SHA"
          git checkout -q --detach FETCH_HEAD

      - name: Install Bun ${{ env.BUN_VERSION }}, Node ${{ env.NODE_VERSION }}, Deno ${{ env.DENO_VERSION }} (pinned by sha256)
        run: |
          curl -fsSL --retry 5 --retry-all-errors --max-time 300 -o "$RUNNER_TEMP/bun.zip" "https://github.com/oven-sh/bun/releases/download/bun-v${BUN_VERSION}/bun-linux-x64.zip"
          echo "${BUN_SHA256}  $RUNNER_TEMP/bun.zip" | sha256sum -c -
          unzip -q "$RUNNER_TEMP/bun.zip" -d "$RUNNER_TEMP"
          mkdir -p "$HOME/.bun/bin" && mv "$RUNNER_TEMP/bun-linux-x64/bun" "$HOME/.bun/bin/bun"
          echo "$HOME/.bun/bin" >> "$GITHUB_PATH"
          curl -fsSL --retry 5 --retry-all-errors --max-time 300 -o "$RUNNER_TEMP/node.tar.xz" "https://nodejs.org/dist/v${NODE_VERSION}/node-v${NODE_VERSION}-linux-x64.tar.xz"
          echo "${NODE_SHA256}  $RUNNER_TEMP/node.tar.xz" | sha256sum -c -
          mkdir -p "$HOME/node" && tar -xJf "$RUNNER_TEMP/node.tar.xz" -C "$HOME/node" --strip-components=1
          echo "$HOME/node/bin" >> "$GITHUB_PATH"
          curl -fsSL --retry 5 --retry-all-errors --max-time 300 -o "$RUNNER_TEMP/deno.zip" "https://github.com/denoland/deno/releases/download/v${DENO_VERSION}/deno-x86_64-unknown-linux-gnu.zip"
          echo "${DENO_SHA256}  $RUNNER_TEMP/deno.zip" | sha256sum -c -
          mkdir -p "$HOME/.deno/bin" && unzip -q "$RUNNER_TEMP/deno.zip" -d "$HOME/.deno/bin"
          echo "$HOME/.deno/bin" >> "$GITHUB_PATH"

      # For the proof's other Node versions (--install-node).
      - name: Install fnm (v1.39.0, digest-checked)
        run: |
          curl -fsSL --max-time 300 -o /tmp/fnm.zip https://github.com/Schniz/fnm/releases/download/v1.39.0/fnm-linux.zip
          echo "7807664f39d39fc518da1c35ba0181e4b3267603c4b1dedeb4b5fc6ae440a224  /tmp/fnm.zip" | sha256sum -c -
          mkdir -p "$HOME/.fnm" && unzip -o -q /tmp/fnm.zip -d "$HOME/.fnm" && chmod +x "$HOME/.fnm/fnm"
          echo "$HOME/.fnm" >> "$GITHUB_PATH"

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Build the npm package
        run: bun run npm:build

      # The tarball npm will publish, proven HERE, before it is kept: CI proved a separate build, so
      # nothing checked the one that ships (review 5).
      - name: Prove the package on every runtime
        run: bun scripts/npm-prove.ts --deno --install-node

      - name: Keep the package for the publish job
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: npm-dist
          path: dist/
          # A week: "Re-run failed jobs" on the npm job the next day needs this artifact (review 4).
          retention-days: 7
          if-no-files-found: error

  npm:
    name: Publish ${{ needs.checks.outputs.tag }} to npm
    needs: [checks, jsr, npm-build]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    env:
      TAG: ${{ needs.checks.outputs.tag }}
    steps:
      # A clone, not only the artifact: npm records the publishing checkout's HEAD as `gitHead`,
      # which verify-release and a re-run compare with the tag's commit.
      - name: This commit (no credentials)
        run: |
          git init -q .
          git remote add origin "https://github.com/${GITHUB_REPOSITORY}"
          git fetch -q --depth=1 origin "$GITHUB_SHA"
          git checkout -q --detach FETCH_HEAD
          AT=$(git ls-remote origin "refs/tags/${TAG}" "refs/tags/${TAG}^{}" \
            | awk '{ if ($2 ~ /\^\{\}$/) p = $1; else t = $1 } END { print (p != "" ? p : t) }')
          if [ "$AT" != "$GITHUB_SHA" ]; then echo "::error::tag ${TAG} is ${AT:-absent}, not this commit"; exit 1; fi

      # npm 11.5.1 or later is trusted publishing's floor; this Node bundles a later one. NO
      # .npmrc: setup-node's `registry-url` wrote a placeholder token npm fell back to when the
      # OIDC exchange failed (1.1.1, run 40739241100).
      - name: Install Node ${{ env.NODE_VERSION }} (pinned by sha256)
        run: |
          curl -fsSL --retry 5 --retry-all-errors --max-time 300 -o "$RUNNER_TEMP/node.tar.xz" "https://nodejs.org/dist/v${NODE_VERSION}/node-v${NODE_VERSION}-linux-x64.tar.xz"
          echo "${NODE_SHA256}  $RUNNER_TEMP/node.tar.xz" | sha256sum -c -
          mkdir -p "$HOME/node" && tar -xJf "$RUNNER_TEMP/node.tar.xz" -C "$HOME/node" --strip-components=1
          echo "$HOME/node/bin" >> "$GITHUB_PATH"
          V="$("$HOME/node/bin/npm" --version)"
          echo "npm $V"
          if [ "$(printf '%s\n%s\n' "11.5.1" "$V" | sort -V | head -1)" != "11.5.1" ]; then
            echo "::error::npm $V is older than 11.5.1: no trusted publishing (OIDC) support"
            exit 1
          fi

      - name: The package npm-build made
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: npm-dist
          path: dist/

      # The tag names the version; the built manifest must say the same, and run nothing on
      # publish (no `scripts`). npm only ever publishes a version JSR has.
      - name: The package is the tag's version, and JSR has it
        run: |
          VERSION=$(node -p 'require("./dist/package.json").version')
          if [ "v${VERSION}" != "${TAG}" ]; then
            echo "::error::dist/package.json is ${VERSION}, the tag is ${TAG} -- refusing to publish."
            exit 1
          fi
          if [ "$(node -p 'Object.keys(require("./dist/package.json").scripts ?? {}).length')" != "0" ]; then
            echo "::error::dist/package.json has scripts, which npm publish would run here -- refusing."
            exit 1
          fi
          PKG="$(jq -r .name jsr.json)"; SCOPE=${PKG%/*}; SCOPE=${SCOPE#@}; NAME=${PKG#*/}
          CODE=$(curl -s -o /dev/null -w "%{http_code}" --max-time 30 -H "Cache-Control: no-cache" "https://api.jsr.io/scopes/${SCOPE}/packages/${NAME}/versions/${VERSION}?cb=${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}")
          if [ "$CODE" != "200" ]; then
            echo "::error::JSR answered ${CODE} for ${PKG}@${VERSION}: npm only ever publishes a version JSR has -- refusing."
            exit 1
          fi
          echo "VERSION=${VERSION}" >> "$GITHUB_ENV"

      # `npm publish` silently REPAIRS a manifest it dislikes -- it dropped the "./main.js" bin
      # (2026-10-28), which would ship a package with no command. Refuse any correction first.
      - name: npm takes the manifest unchanged
        working-directory: dist
        shell: bash # -eo pipefail: a failing dry run must not hide behind `tee`
        run: |
          CODE=$(curl -s -o /dev/null -w '%{http_code}' --max-time 30 -H "Cache-Control: no-cache" "https://registry.npmjs.org/${NPM_PACKAGE/\//%2f}/${VERSION}?cb=${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}")
          # A version npm already has cannot be dry-run; the next step judges it.
          if [ "$CODE" = "200" ]; then echo "already on npm -- the publish step judges it"; exit 0; fi
          npm publish --dry-run --access public 2>&1 | tee ../npm-dry-run.log
          if grep -Eq 'auto-corrected|errors corrected|was invalid and removed' ../npm-dry-run.log; then
            echo "::error::npm would change the manifest on publish -- refusing (see the dry run above)."
            exit 1
          fi

      # npm versions are immutable too: a re-run stops cleanly when npm has THIS commit's copy
      # (npm records the publishing checkout's HEAD as gitHead), and fails on another's. On
      # failure, npm's own error goes into an ANNOTATION: job logs need a signed-in session.
      # OIDC ONLY -- no npm token exists for this package (owner, 2026-10-28; roadmap task 15).
      - name: Publish to npm (unless npm already has the version)
        working-directory: dist
        shell: bash
        run: |
          CODE=$(curl -s -o /dev/null -w '%{http_code}' --max-time 30 -H "Cache-Control: no-cache" "https://registry.npmjs.org/${NPM_PACKAGE/\//%2f}/${VERSION}?cb=${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}")
          if [ "$CODE" = "200" ]; then
            HEAD_ON_NPM=$(curl -sf --max-time 30 -H "Cache-Control: no-cache" "https://registry.npmjs.org/${NPM_PACKAGE/\//%2f}/${VERSION}?cb=${GITHUB_RUN_ID}-h" | jq -r '.gitHead // empty' || true)
            if [ "$HEAD_ON_NPM" != "$GITHUB_SHA" ]; then
              echo "::error::${NPM_PACKAGE}@${VERSION} is on npm from '${HEAD_ON_NPM:-no recorded commit}', not ${GITHUB_SHA} -- the registries differ."
              exit 1
            fi
            echo "npm already has ${VERSION} from this commit (a re-run): not uploading again"
            exit 0
          fi
          if [ "$CODE" != "404" ]; then echo "::error::npm version probe: HTTP $CODE"; exit 1; fi
          npm --version
          # --loglevel verbose: the trusted-publishing (OIDC) exchange is logged only at verbose.
          if ! npm publish --access public --loglevel verbose > ../npm-publish.log 2>&1; then
            cat ../npm-publish.log
            MSG=$(grep -Ei 'npm (error|ERR|warn)|oidc|trusted|provenance|token' ../npm-publish.log | grep -v 'Tarball\|notice [0-9]' | tail -n 25 | sed ':a;N;$!ba;s/%/%25/g;s/\r//g;s/\n/%0A/g')
            echo "::error title=npm publish failed::${MSG:-$(tail -n 15 ../npm-publish.log | tr '\n' ' ')}"
            exit 1
          fi
          cat ../npm-publish.log

      # The evidence, FATAL (U8): the attestation read back from the registry, cache-busted, up to
      # 10 minutes (the loader's 2.0.1 took more than 3). It was read only by verify-release on
      # the owner's machine until 2026-11-10.
      - name: Verify provenance was recorded on npm
        run: |
          URL="https://registry.npmjs.org/${NPM_PACKAGE/\//%2f}/${VERSION}"
          for i in $(seq 1 40); do
            BODY=$(curl -sf --max-time 30 -H "Cache-Control: no-cache" "${URL}?cb=${GITHUB_RUN_ID}-${i}" || true)
            P=$(printf '%s' "$BODY" | jq -r '.dist.attestations.provenance.predicateType // empty' 2>/dev/null || true)
            H=$(printf '%s' "$BODY" | jq -r '.gitHead // empty' 2>/dev/null || true)
            if [ -n "$P" ]; then
              if [ "$H" != "$GITHUB_SHA" ]; then echo "::error::npm's ${VERSION} records gitHead '${H}', not ${GITHUB_SHA}"; exit 1; fi
              echo "✅ npm provenance recorded: $P (gitHead ${H})"
              echo "- npm: ${NPM_PACKAGE}@${VERSION}, provenance $P" >> "$GITHUB_STEP_SUMMARY"
              exit 0
            fi
            echo "  attempt $i: not visible yet, retrying in 15s"
            sleep 15
          done
          echo "::error::${NPM_PACKAGE}@${VERSION} has no provenance attestation on npm after 10 minutes. If the upload happened, the version exists and is immutable."
          exit 1
