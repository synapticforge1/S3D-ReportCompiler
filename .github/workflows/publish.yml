name: Publish to JSR and npm

# A v* tag publishes to JSR, then to npm. "Run workflow" with a tag publishes ONLY to npm — for a
# version already on JSR (1.1.0 was released to JSR before the npm job existed). npm's trusted
# publisher for @synapticforge1/s3d-reportcompiler names THIS file and no environment (owner,
# 2026-10-28): renaming the file or adding an environment breaks npm publishing.
# 🔒 JSR and npm are released together, always (owner, 2026-10-28), and only from a commit CI
# passed: the `ci-green` job below gates both, on both entry points. Every job publishes the ONE
# commit ci-green resolved, and re-checks immediately before each immutable step that the tag
# still points at it (2026-11-06 review: a moved tag could put different commits on the two
# registries under one version).
on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing tag to publish to npm only (e.g. v1.1.0)"
        required: true

# One run per tag at a time; a newer run for the same tag WAITS for the older -- it never cancels
# it. Cancelling (2026-11-06 to -07) could stop a run after `deno publish` succeeded and before
# `record` wrote release/<tag>: JSR had the version, npm-only recovery needs that branch, so npm
# could never get it (2026-11-07 review). Cancelling is not needed for the case it was added for --
# a release retried after moving its tag: the old run's ci-green refuses a tag that no longer
# points at its pushed commit, and every job re-checks the tag right before its immutable step.
concurrency:
  group: publish-${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
  cancel-in-progress: false

jobs:
  # Nothing is published from a commit CI did not pass. `bun run release` pushes the commit to main
  # BEFORE the tag, so ci.yml runs on exactly this SHA; this waits for that run and requires
  # success. No run, a failed run, a cancelled one, or one still going after 40 minutes: refused.
  # On "Run workflow" too (it used to skip all of this): there, the commit is the dispatched tag's.
  ci-green:
    name: CI passed on the tagged commit
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read # the compare API, for "the tagged commit is on main"
    outputs:
      sha: ${{ steps.target.outputs.sha }}
      tag: ${{ steps.target.outputs.tag }}
    steps:
      # The one commit every later job checks out and publishes. A tag push: the pushed commit, and
      # the tag must still point at it (a moved tag means a newer run owns this release). "Run
      # workflow": whatever the named tag points at now.
      - name: The commit to release
        id: target
        env:
          GH_TOKEN: ${{ github.token }}
          EVENT: ${{ github.event_name }}
          TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
          PUSHED: ${{ github.sha }}
        run: |
          # "Run workflow" runs the copy of THIS FILE on the branch picked in "Use workflow from".
          # Every release leaves a release/v* branch whose copy predates the current gates, and npm's
          # trusted publisher names only the file, so an old copy could still publish. Only main's
          # copy may run by hand (2026-11-06 review; the picker was chosen wrongly 3 times of 3).
          # ⚠️ This guards copies made from now on; older release/v* copies lack it (owner action,
          # cmem/roadmap.md).
          if [ "$EVENT" = "workflow_dispatch" ] && [ "$GITHUB_REF" != "refs/heads/main" ]; then
            echo "::error::Run this workflow from main (\"Use workflow from: main\"), not ${GITHUB_REF}."
            exit 1
          fi
          case "$TAG" in v[0-9]*) ;; *) echo "::error::'${TAG}' is not a v* release tag."; exit 1 ;; esac
          NOW=$(gh api "repos/${GITHUB_REPOSITORY}/commits/${TAG}" --jq .sha)
          if [ -z "$NOW" ]; then echo "::error::No commit for tag ${TAG}."; exit 1; fi
          if [ "$EVENT" = "push" ] && [ "$NOW" != "$PUSHED" ]; then
            echo "::error::${TAG} now points at ${NOW}, not the pushed ${PUSHED} — a newer run owns it; refusing."
            exit 1
          fi
          # "Run workflow" recovers npm for the commit JSR GOT, which release/<tag> records. A tag
          # moved since then is refused here, by name -- it used to be resolved and built, and only
          # the npm job's last check refused it (review 4).
          if [ "$EVENT" = "workflow_dispatch" ]; then
            REL=$(gh api "repos/${GITHUB_REPOSITORY}/commits/release/${TAG}" --jq .sha 2>/dev/null || true)
            [[ "$REL" =~ ^[0-9a-f]{40}$ ]] || REL="" # a 404 answers with a body, not a SHA
            if [ -z "$REL" ]; then echo "::error::No release/${TAG} branch: JSR's commit was never recorded — refusing."; exit 1; fi
            if [ "$REL" != "$NOW" ]; then
              echo "::error::${TAG} points at ${NOW}, but JSR got ${REL} (release/${TAG}) — move the tag back, or release a new version; refusing."
              exit 1
            fi
          fi
          echo "sha=${NOW}" >> "$GITHUB_OUTPUT"
          echo "tag=${TAG}" >> "$GITHUB_OUTPUT"
          echo "✅ releasing ${TAG} = ${NOW}"

      # Only main is released (publish.ts refuses any other branch; this is the same rule from the
      # registry side). ci.yml runs on every branch, so "CI passed" alone would let a tag on an
      # unmerged branch publish it. `bun run release` pushes main BEFORE the tag, so the tagged
      # commit is main's head: "identical" (or "behind", once main has moved on).
      - name: The tagged commit is on main
        env:
          GH_TOKEN: ${{ github.token }}
          SHA: ${{ steps.target.outputs.sha }}
        run: |
          STATUS=$(gh api "repos/${GITHUB_REPOSITORY}/compare/main...${SHA}" --jq .status)
          if [ "$STATUS" != "identical" ] && [ "$STATUS" != "behind" ]; then
            echo "::error::${SHA} is not on main (compare status '${STATUS}') — refusing to publish."
            exit 1
          fi
          echo "✅ ${SHA} is on main (${STATUS})"

      - name: Wait for ci.yml on this commit, and require success
        env:
          GH_TOKEN: ${{ github.token }}
          SHA: ${{ steps.target.outputs.sha }}
        run: |
          for i in $(seq 1 80); do
            # A PUSH run of this commit: a pull_request run tests a merge commit, not this one, and
            # the newest run of any kind could be that (2026-11-06 review).
            RUN=$(gh api "repos/${GITHUB_REPOSITORY}/actions/workflows/ci.yml/runs?head_sha=${SHA}&event=push&per_page=1" \
              --jq '.workflow_runs[0] | "\(.status) \(.conclusion) \(.html_url)"' || true)
            set -- $RUN
            if [ "${1:-}" = "completed" ]; then
              if [ "${2:-}" = "success" ]; then
                echo "✅ CI passed on ${SHA}: ${3}"
                exit 0
              fi
              echo "::error::CI on ${SHA} concluded '${2}', not success — refusing to publish (${3})."
              exit 1
            fi
            echo "  attempt ${i}/80: CI on ${SHA} is '${1:-not started}'"
            sleep 30
          done
          echo "::error::No completed CI run for ${SHA} after 40 minutes — refusing to publish."
          exit 1

  # The gates that RUN third-party code -- the dependencies (MathJax, pdf.js, the native canvas) in
  # the compatibility gate, Deno and tar in the upload check -- in a job that holds no publishing
  # credential. `id-token: write` IS the credential (JSR and npm both trust this workflow's OIDC
  # token), and every step of a job that has it can ask for one: these used to run in the publish
  # job itself (2026-11-07 review). The publish job below installs without running anything.
  checks:
    needs: ci-green
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    # The Deno this job's upload check ran, for the publish job to install exactly: each floated
    # `v2.x` on its own, so a Deno released between the jobs published unchecked (review 4).
    outputs:
      deno: ${{ steps.deno.outputs.version }}
    steps:
      # Every action pinned to a commit (2026-11-07 review): a moved tag of a third-party action
      # would otherwise run new code in a release. The comment names the version it was.
      - name: Checkout
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          ref: ${{ needs.ci-green.outputs.sha }} # the exact commit ci-green resolved and checked
          fetch-depth: 0 # the SemVer gate reads the last v* tag

      - name: Setup Deno
        uses: denoland/setup-deno@22d081ff2d3a40755e97629de92e3bcbfa7cf2ed # v2.0.5
        with:
          deno-version: v2.x

      - name: The Deno version, for the publish job
        id: deno
        run: echo "version=$(deno --version | head -n 1 | cut -d ' ' -f 2)" >> "$GITHUB_OUTPUT"

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.4.4

      - name: Install dependencies
        run: bun install --frozen-lockfile

      # The last gate before an IMMUTABLE version: publish to a fake JSR on 127.0.0.1 (dummy token,
      # no provenance) and read the tarball — `deno publish` has exited 0 on a corrupted upload.
      - name: The upload is this package, intact
        run: bun scripts/jsr-upload-check.ts

      # SemVer is a gate result, and the gate ran only on the developer's machine (`bun run
      # release`): a hand-edited version and a pushed tag published a patch that removed an export,
      # provided CI was green (2026-11-06 review). The same gate, here, on the tagged commit: the
      # surface since the last tag, and the last tag's samples on the new code (Chrome renders).
      - name: The compatibility gate allows this version
        run: bun scripts/compat.ts release "$(bun -p "require('./jsr.json').version")" --unpublished

  publish:
    needs: [ci-green, checks]
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    # No write access to the repository here, and no third-party code run: the dependencies are
    # installed with their scripts off, for `deno publish` to READ (nodeModulesDir "manual"). The
    # only writes a release makes -- its branch and its GitHub release -- are in the `record` and
    # `finalize` jobs, which install nothing (2026-11-06 review).
    permissions:
      contents: read
      id-token: write

    steps:
      - name: Checkout
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          ref: ${{ needs.ci-green.outputs.sha }} # the exact commit ci-green resolved and checked

      # DO NOT pin this to chase a missing JSR provenance attestation. That experiment was already
      # run on the sibling `wasmtk` project on 2026-07-30 and RULED OUT: its provenance history
      # split exactly on a Deno release boundary (<= 2.9.1 attested, >= 2.9.2 not), which looked
      # causal, so a release was published with `deno-version: v2.9.1` pinned. It published with no
      # provenance anyway (JSR `rekorLogId` null), so the Deno version is NOT the cause and the
      # correlation was coincidental.
      #
      # The absence was a JSR-side issue, not a defect in this workflow's provenance setup. Floating
      # `v2.x` is correct, and nothing here needs changing to obtain an attestation. It floats ONCE,
      # in `checks`: this job installs the exact version the upload check ran (review 4).
      - name: Setup Deno
        uses: denoland/setup-deno@22d081ff2d3a40755e97629de92e3bcbfa7cf2ed # v2.0.5
        with:
          deno-version: ${{ needs.checks.outputs.deno }}

      # REQUIRED, and easy to leave out: jsr.json sets "nodeModulesDir": "manual", so Deno resolves
      # the npm dependencies from an on-disk node_modules that something else has to create. Without
      # this step `deno publish` cannot resolve `mathjax-full` and fails before publishing anything:
      #
      #   error: Could not find "mathjax-full" in a node_modules folder.
      #
      # `bun install --frozen-lockfile` installs bun.lock exactly (the lockfile since 2026-10-28;
      # `npm ci` and package-lock.json before — the same 20 package versions, measured) and fails
      # rather than drift. "manual" is deliberate — see cmem/architecture.md: it keeps Deno reading
      # the same node_modules as Node and Bun, which is what makes the three produce identical output.
      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.4.4

      # --ignore-scripts: in the job that can mint a publishing token, nothing installed runs.
      - name: Install dependencies (no scripts)
        run: bun install --frozen-lockfile --ignore-scripts

      # Provenance requires a GitHub OIDC token. The `id-token: write` permission above is what
      # injects ACTIONS_ID_TOKEN_REQUEST_URL/_TOKEN into the runner. If they are absent despite the
      # permission, an org/enterprise Actions OIDC policy is blocking the token and `deno publish`
      # will silently skip provenance (the publish itself still succeeds). This makes that failure
      # mode visible instead of leaving it to be discovered on jsr.io.
      - name: Check OIDC availability (provenance prerequisite)
        run: |
          if [ -n "${ACTIONS_ID_TOKEN_REQUEST_URL:-}" ] && [ -n "${ACTIONS_ID_TOKEN_REQUEST_TOKEN:-}" ]; then
            echo "OIDC token endpoint available — provenance prerequisites met."
          else
            echo "::warning::OIDC token NOT available (URL present: ${ACTIONS_ID_TOKEN_REQUEST_URL:+yes}, TOKEN present: ${ACTIONS_ID_TOKEN_REQUEST_TOKEN:+yes}). deno publish will skip provenance. Verify id-token:write is honored — check org/enterprise Settings → Actions → General OIDC policy."
          fi

      # Immediately before the immutable step: the tag still points at this commit, it names the
      # version jsr.json declares, and JSR does not have that version yet. Until 2026-11-06 the
      # JSR job checked none of these: a tag on a commit whose jsr.json said another version
      # published THAT version under this tag; and `deno publish` SKIPS an existing version with
      # exit 0, so a re-run, or a run for a tag moved after JSR published, went on as if it had
      # published this commit.
      - name: Pinned — the tag, its commit, its version, and JSR's 404
        env:
          TAG: ${{ needs.ci-green.outputs.tag }}
          SHA: ${{ needs.ci-green.outputs.sha }}
        run: |
          NOW=$(git ls-remote --tags origin "refs/tags/${TAG}^{}" | cut -f1)
          [ -n "$NOW" ] || NOW=$(git ls-remote --tags origin "refs/tags/${TAG}" | cut -f1)
          if [ "$NOW" != "$SHA" ]; then
            echo "::error::${TAG} now points at '${NOW}', not ${SHA} — refusing to publish."
            exit 1
          fi
          VERSION=$(bun -p "require('./jsr.json').version")
          if [ "v${VERSION}" != "${TAG}" ]; then
            echo "::error::jsr.json says ${VERSION}, the tag is ${TAG} — refusing to publish."
            exit 1
          fi
          PKG=$(bun -p "require('./jsr.json').name"); SCOPE=${PKG%/*}; SCOPE=${SCOPE#@}; NAME=${PKG#*/}
          CODE=$(curl -s -o /dev/null -w "%{http_code}" "https://api.jsr.io/scopes/${SCOPE}/packages/${NAME}/versions/${VERSION}")
          if [ "$CODE" != "404" ]; then
            echo "::error::JSR answered ${CODE} for ${PKG}@${VERSION} (only 404, 'not published', lets this run publish) — refusing."
            exit 1
          fi
          echo "✅ ${TAG} = ${SHA}, jsr.json ${VERSION}, not on JSR yet"

      - name: Publish to JSR
        run: deno publish

  # Informational, in its own job: inside `publish` its two-minute poll kept the job running after
  # `deno publish`, and `record` (the release branch npm-only recovery needs) waited on it.
  jsr-score:
    needs: [ci-green, publish]
    if: github.event_name == 'push' && needs.publish.result == 'success'
    runs-on: ubuntu-latest
    continue-on-error: true
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          ref: ${{ needs.ci-green.outputs.sha }}

      - name: Setup Deno
        uses: denoland/setup-deno@22d081ff2d3a40755e97629de92e3bcbfa7cf2ed # v2.0.5
        with:
          deno-version: v2.x

      # Reports whether JSR recorded a provenance attestation. It does NOT fail the job.
      #
      # 📌 Owner decision (2026-08-08): the missing `rekorLogId` on the sibling `wasmtk` project is a
      # JSR-side issue and is being ignored. JSR reports that package at a 100% score while still
      # flagging provenance, which is what makes it a reporting problem on their end rather than
      # anything this workflow can fix.
      #
      # So this step warns rather than erroring. A step that fails on every release for a known
      # upstream quirk does not communicate "something is wrong" — it makes a red job the normal
      # state, and the next genuine failure gets waved through with it. The information is still
      # worth surfacing, so it is printed either way; it just is not a gate.
      #
      # If JSR fixes it, this starts printing the Rekor log ID and nothing else has to change.
      - name: Report the JSR package score
        continue-on-error: true
        run: |
          PKG=$(deno eval 'console.log(JSON.parse(Deno.readTextFileSync("jsr.json")).name)')
          SCOPE=${PKG%/*}; SCOPE=${SCOPE#@}
          NAME=${PKG#*/}
          # The score is the headline quality signal and the thing worth watching release to
          # release: it covers docs coverage, no-slow-types, a description, a readme and a licence,
          # all of which ARE under this repository's control — unlike the provenance flag below.
          SCORE=$(curl -sf -H "Accept: application/json" \
            "https://api.jsr.io/scopes/${SCOPE}/packages/${NAME}" \
            | deno eval 'const t=await new Response(Deno.stdin.readable).text(); try { console.log(JSON.parse(t).score ?? "") } catch { console.log("") }' || true)
          if [ -n "$SCORE" ]; then
            echo "📊 JSR score: ${SCORE}%"
            [ "$SCORE" -lt 100 ] 2>/dev/null && echo "::warning::JSR score is ${SCORE}%, not 100%. See https://jsr.io/${PKG}/score for the breakdown."
          else
            echo "::warning::Could not read the JSR score (the package may still be ingesting)."
          fi

          VERSION=${GITHUB_REF_NAME#v}
          URL="https://api.jsr.io/scopes/${SCOPE}/packages/${NAME}/versions/${VERSION}"
          echo "Checking $URL"
          # JSR ingests asynchronously, so poll rather than reading once. Six attempts, not twelve:
          # this is informational, so there is no reason to spend three minutes of runner time on it.
          for i in $(seq 1 6); do
            BODY=$(curl -sf -H "Accept: application/json" "$URL" || true)
            REKOR=$(printf '%s' "$BODY" | deno eval 'const t=await new Response(Deno.stdin.readable).text(); try { console.log(JSON.parse(t).rekorLogId ?? "") } catch { console.log("") }' || true)
            if [ -n "$REKOR" ]; then
              echo "✅ Provenance recorded — Rekor log ID: $REKOR"
              exit 0
            fi
            echo "  attempt $i: no Rekor entry yet, retrying in 15s"
            sleep 15
          done
          echo "::warning::${PKG}@${VERSION} shows no Sigstore/Rekor entry on JSR. The package IS published and the GitHub release IS created — only the attestation is unreported. This is a known JSR-side issue (see the comment above) and is expected; it is NOT a release failure and needs no action here."
          exit 0

  # The record of exactly which commit JSR got: release/<tag> at that commit. "Run workflow" (npm
  # only) publishes to npm only the commit this branch names. Its own job, after JSR and beside npm:
  # a failure here used to skip npm, and "Re-run failed jobs" then stopped at JSR's 404 check
  # (2026-11-06 review). This job installs nothing; it is the one that may push.
  record:
    needs: [ci-green, publish]
    if: github.event_name == 'push' && needs.publish.result == 'success'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          ref: ${{ needs.ci-green.outputs.sha }}
      - name: Create the release branch at the commit JSR got
        env:
          TAG: ${{ needs.ci-green.outputs.tag }}
          SHA: ${{ needs.ci-green.outputs.sha }}
        run: |
          EXISTING=$(git ls-remote origin "refs/heads/release/${TAG}" | cut -f1)
          if [ -n "$EXISTING" ] && [ "$EXISTING" != "$SHA" ]; then
            echo "::error::release/${TAG} already names ${EXISTING}, not ${SHA} -- refusing to move it."
            exit 1
          fi
          git push origin "${SHA}:refs/heads/release/${TAG}"
          echo "✅ release/${TAG} = ${SHA}"

  # npm: @synapticforge1/s3d-reportcompiler, built from the same tag by `bun run npm:build` (compiled
  # JS + .d.ts, a generated manifest with a bin). Trusted publishing: `npm publish` authenticates
  # with this run's OIDC token (id-token: write) — no npm token exists anywhere — and npm records
  # provenance itself. CI proves the tarball (`npm:prove`) on every push, the tagged commit's too.
  # The npm package is BUILT here, with no publishing credential: the build runs tsc and the
  # installed dependencies (2026-11-07 review: it ran in the job holding `id-token: write`). The
  # `npm` job below publishes this artifact, and runs nothing but npm and git.
  npm-build:
    needs: [ci-green, publish]
    # After a successful JSR publish on a tag push; or alone, on "Run workflow" with a tag -- and
    # in both cases only after ci-green passed for the commit (the dispatch path used to skip it:
    # no CI, no main check, no JSR check).
    if: >-
      !cancelled() && needs.ci-green.result == 'success' && (needs.publish.result == 'success' ||
      (github.event_name == 'workflow_dispatch' && needs.publish.result == 'skipped'))
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          # The exact commit ci-green resolved -- the one JSR got. By tag NAME (as it was), a tag
          # moved after the JSR job had checked out its commit would have given npm another one.
          ref: ${{ needs.ci-green.outputs.sha }}

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.4.4

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Build the npm package
        run: bun run npm:build

      - name: Keep the package for the publish job
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: npm-dist
          path: dist/
          # A week: "Re-run failed jobs" on the npm job the next day needs this artifact (review 4).
          retention-days: 7
          if-no-files-found: error

  npm:
    needs: [ci-green, publish, npm-build]
    if: "!cancelled() && needs.npm-build.result == 'success'"
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write

    steps:
      # For the pinned check below (the tag and the release branch, read with git), and jsr.json.
      - name: Checkout
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          ref: ${{ needs.ci-green.outputs.sha }}

      # Node 24 bundles npm 12, past trusted publishing's npm 11.5.1 floor. NO `registry-url`: with
      # it, setup-node writes an .npmrc whose token is NODE_AUTH_TOKEN's placeholder
      # (XXXXX-XXXXX-…), and when the OIDC exchange failed npm fell back to that "token" and the
      # registry answered 404 (1.1.1, run 40739241100). Without it a failed exchange says so.
      - name: Setup Node
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: 24

      - name: The package npm-build made
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: npm-dist
          path: dist/

      # The tag names the version; the built manifest must say the same, or this would publish a
      # version nobody tagged. And the manifest runs nothing on publish (no `scripts`).
      - name: The package version is the tag's
        env:
          TAG: ${{ needs.ci-green.outputs.tag }}
        run: |
          VERSION=$(node -p 'require("./dist/package.json").version')
          if [ "v${VERSION}" != "${TAG}" ]; then
            echo "::error::dist/package.json is ${VERSION}, the tag is ${TAG} — refusing to publish."
            exit 1
          fi
          if [ "$(node -p 'Object.keys(require("./dist/package.json").scripts ?? {}).length')" != "0" ]; then
            echo "::error::dist/package.json has scripts, which npm publish would run here — refusing."
            exit 1
          fi
          echo "VERSION=${VERSION}" >> "$GITHUB_ENV"

      # `npm publish` silently REPAIRS a manifest it dislikes — it dropped the "./main.js" bin
      # (2026-10-28), which would ship a package with no command. Refuse any correction first.
      - name: npm takes the manifest unchanged
        working-directory: dist
        shell: bash # -eo pipefail: a failing dry run must not hide behind `tee`
        run: |
          # A version npm already has cannot be dry-run ("cannot publish over…"); the next step
          # skips it anyway, so there is nothing to check.
          if npm view "$(node -p 'require("./package.json").name')@${VERSION}" version >/dev/null 2>&1; then
            echo "already on npm — the publish step will skip it"
            exit 0
          fi
          npm publish --dry-run --access public 2>&1 | tee ../npm-dry-run.log
          if grep -Eq 'auto-corrected|errors corrected|was invalid and removed' ../npm-dry-run.log; then
            echo "::error::npm would change the manifest on publish — refusing (see the dry run above)."
            exit 1
          fi

      # Pinned again right before npm's immutable step: the JSR job takes minutes, and a tag moved
      # meanwhile must not get its new commit onto npm under the old one's version. On "Run
      # workflow" (npm only, for a version already on JSR) JSR must have the version: it used to
      # publish any tag's commit to npm, on JSR or not.
      - name: Pinned — the tag still points at this commit; on dispatch, JSR has the version
        env:
          TAG: ${{ needs.ci-green.outputs.tag }}
          SHA: ${{ needs.ci-green.outputs.sha }}
          EVENT: ${{ github.event_name }}
        run: |
          NOW=$(git ls-remote --tags origin "refs/tags/${TAG}^{}" | cut -f1)
          [ -n "$NOW" ] || NOW=$(git ls-remote --tags origin "refs/tags/${TAG}" | cut -f1)
          if [ "$NOW" != "$SHA" ]; then
            echo "::error::${TAG} now points at '${NOW}', not ${SHA} — refusing to publish."
            exit 1
          fi
          if [ "$EVENT" = "workflow_dispatch" ]; then
            PKG=$(node -p "require('./jsr.json').name"); SCOPE=${PKG%/*}; SCOPE=${SCOPE#@}; NAME=${PKG#*/}
            CODE=$(curl -s -o /dev/null -w "%{http_code}" "https://api.jsr.io/scopes/${SCOPE}/packages/${NAME}/versions/${VERSION}")
            if [ "$CODE" != "200" ]; then
              echo "::error::JSR answered ${CODE} for ${PKG}@${VERSION}: npm-only publishing is for a version already on JSR — refusing."
              exit 1
            fi
            # ...and JSR got THIS commit: the release branch the JSR run recorded must name it. Only
            # "JSR has the version" and "the tag points here today" were checked, so a tag moved
            # after JSR published (a cancelled run, a retried release) put another commit on npm
            # under the same version (2026-11-06 review).
            REL=$(git ls-remote origin "refs/heads/release/${TAG}" | cut -f1)
            if [ "$REL" != "$SHA" ]; then
              echo "::error::release/${TAG} names '${REL}', not ${SHA}: JSR got another commit (or none was recorded) — refusing."
              exit 1
            fi
          fi
          echo "✅ ${TAG} = ${SHA}"

      # npm versions are immutable too. A re-run must stop cleanly, not fail on a duplicate.
      # On failure, npm's own error goes into an ANNOTATION: job logs need a signed-in GitHub
      # session, annotations are public — the 1.1.1 failure showed only "exit code 1".
      #
      # OIDC ONLY — no npm token exists for this package. The trusted publisher is set ON the
      # package (it can only be once the package exists, so 1.1.0 was published by hand); a token
      # bootstrap was tried for the first version and failed on npm's 2FA (EOTP), and is gone
      # (owner, 2026-10-28: "rerun it without the token"). cmem/roadmap.md task 15 has the story.
      - name: Publish to npm
        working-directory: dist
        shell: bash
        env:
          SHA: ${{ needs.ci-green.outputs.sha }}
        run: |
          NAME=$(node -p 'require("./package.json").name')
          if npm view "${NAME}@${VERSION}" version >/dev/null 2>&1; then
            # "Already there" is success only if it is THIS commit (npm records the publishing
            # checkout's HEAD as gitHead); it used to be reported as success whatever npm held.
            HEAD_ON_NPM=$(npm view "${NAME}@${VERSION}" gitHead 2>/dev/null || true)
            if [ -n "$HEAD_ON_NPM" ] && [ "$HEAD_ON_NPM" != "$SHA" ]; then
              echo "::error::${NAME}@${VERSION} is on npm from ${HEAD_ON_NPM}, not ${SHA} — the registries differ."
              exit 1
            fi
            [ -n "$HEAD_ON_NPM" ] || echo "::warning::npm records no gitHead for ${NAME}@${VERSION}; its commit cannot be compared."
            echo "::notice::${NAME}@${VERSION} is already on npm (${HEAD_ON_NPM:-commit unrecorded}) — nothing to publish."
            exit 0
          fi
          npm --version
          # --loglevel verbose: the trusted-publishing (OIDC) exchange is logged only at verbose.
          if ! npm publish --access public --loglevel verbose > ../npm-publish.log 2>&1; then
            cat ../npm-publish.log
            MSG=$(grep -Ei 'npm (error|ERR|warn)|oidc|trusted|provenance|token' ../npm-publish.log | grep -v 'Tarball\|notice [0-9]' | tail -n 25 | sed ':a;N;$!ba;s/%/%25/g;s/\r//g;s/\n/%0A/g')
            echo "::error title=npm publish failed::${MSG:-$(tail -n 15 ../npm-publish.log | tr '\n' ' ')}"
            exit 1
          fi
          cat ../npm-publish.log

  # The GitHub release comes LAST, after both registries: it used to be created between JSR and npm,
  # so a failure there skipped npm. Installs nothing; may write. On "Run workflow" (npm-only
  # recovery) too: it used to run on a tag push alone, so a release whose npm job failed and was
  # recovered by hand got no GitHub release, and nothing said so (2026-11-07 review). There the
  # release branch exists already -- the npm job required it.
  finalize:
    needs: [ci-green, record, npm]
    if: >-
      !cancelled() && needs.npm.result == 'success' &&
      (needs.record.result == 'success' || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Create the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.ci-green.outputs.tag }}
        run: |
          if gh release view "${TAG}" --repo "${GITHUB_REPOSITORY}" >/dev/null 2>&1; then
            echo "::notice::the GitHub release ${TAG} already exists"
            exit 0
          fi
          gh release create "${TAG}" --repo "${GITHUB_REPOSITORY}" \
            --title "${TAG}" --target "release/${TAG}" --generate-notes
